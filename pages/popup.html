<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AM eBay Listing Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        --bg: #070a12;
        --panel: rgba(17, 24, 39, 0.94);
        --panel-2: rgba(30, 41, 59, 0.88);
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.22);
        --blue: #60a5fa;
        --blue-2: #2563eb;
        --green: #22c55e;
        --danger: #fb7185;
      }

      body {
        margin: 0;
        width: 390px;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 0%, rgba(37, 99, 235, 0.26), transparent 34%),
          radial-gradient(circle at 88% 8%, rgba(34, 197, 94, 0.13), transparent 32%),
          var(--bg);
      }

      .screen {
        display: none;
        padding: 18px;
      }

      .screen.active {
        display: block;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 19px;
        letter-spacing: -0.03em;
      }

      .lock-title {
        margin-bottom: 10px;
      }

      .lock-form {
        display: grid;
        grid-template-columns: 1fr 42px;
        gap: 8px;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input,
      select {
        min-width: 0;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        background: rgba(15, 23, 42, 0.78);
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: rgba(96, 165, 250, 0.9);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.16);
      }

      button {
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--blue-2), #7c3aed);
        color: white;
        padding: 11px 12px;
        font-weight: 700;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.22);
      }

      button.secondary {
        background: rgba(96, 165, 250, 0.12);
        color: #bfdbfe;
        box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.22);
      }

      button.ghost {
        background: transparent;
        color: var(--muted);
        padding-inline: 0;
        box-shadow: none;
      }

      .grid {
        display: grid;
        gap: 8px;
      }

      .meta {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
        font-size: 12px;
        color: var(--muted);
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.24);
      }

      .meta strong {
        display: block;
        color: var(--text);
        font-size: 13px;
        margin-bottom: 4px;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .status {
        min-height: 18px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <section id="lock-screen" class="screen">
      <h1 class="lock-title">Enter access password</h1>
      <form id="lock-form" class="lock-form">
        <input id="password" type="password" autocomplete="current-password" autofocus>
        <button type="submit" aria-label="Submit password"></button>
      </form>
      <div id="lock-status" class="status" aria-live="polite"></div>
    </section>

    <section id="tools-screen" class="screen">
      <h1>AM eBay Listing Assistant</h1>
      <div class="meta">
        <strong id="product-title">No product loaded</strong>
        <span id="product-summary">Open an AliExpress product page and scrape it.</span>
      </div>
      <label class="field">
        eBay region
        <select id="region-select"></select>
      </label>
      <div class="grid" style="margin-top: 12px;">
        <button id="scrape-btn">Scrape Current Product</button>
        <button id="editor-btn" class="secondary">Open Editor</button>
        <button id="list-btn" class="secondary">List It</button>
        <button id="lock-btn" class="ghost">Lock</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
