<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AM eBay Listing Assistant Editor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        --bg: #070a12;
        --panel: rgba(15, 23, 42, 0.92);
        --panel-2: rgba(30, 41, 59, 0.74);
        --blue: #60a5fa;
        --blue-2: #2563eb;
        --green: #22c55e;
        --red: #fb7185;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.2);
        --surface: rgba(15, 23, 42, 0.62);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 12% -8%, rgba(37, 99, 235, 0.32), transparent 30%),
          radial-gradient(circle at 90% 4%, rgba(34, 197, 94, 0.13), transparent 28%),
          linear-gradient(180deg, #070a12 0%, #0f172a 100%);
        min-height: 100vh;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        background: rgba(7, 10, 18, 0.82);
        backdrop-filter: blur(18px);
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        letter-spacing: -0.04em;
      }

      h2 {
        font-size: 17px;
        letter-spacing: -0.025em;
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .lock-card {
        width: min(420px, calc(100% - 32px));
        margin: 80px auto;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      .lock-form {
        display: grid;
        grid-template-columns: 1fr 44px;
        gap: 8px;
        margin-top: 12px;
      }

      main {
        display: grid;
        gap: 16px;
        padding: 22px;
      }

      .card {
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--panel);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }

      input,
      textarea,
      select,
      button {
        font: inherit;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        background: rgba(2, 6, 23, 0.62);
        outline: none;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: rgba(96, 165, 250, 0.9);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
      }

      textarea {
        min-height: 150px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      button {
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--blue-2), #7c3aed);
        color: white;
        padding: 10px 13px;
        font-weight: 700;
        box-shadow: 0 12px 26px rgba(37, 99, 235, 0.22);
      }

      button.secondary {
        background: rgba(96, 165, 250, 0.12);
        color: #bfdbfe;
        box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.22);
      }

      button.success {
        background: linear-gradient(135deg, #16a34a, #22c55e);
      }

      button.danger {
        background: rgba(251, 113, 133, 0.12);
        color: var(--red);
        box-shadow: inset 0 0 0 1px rgba(251, 113, 133, 0.24);
      }

      button.icon {
        width: 44px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
      }

      .image-card {
        display: grid;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel-2);
      }

      .image-card img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        border-radius: 12px;
        background: #111827;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 8px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--surface);
        color: #cbd5e1;
      }

      td input {
        min-width: 110px;
      }

      .scroll {
        overflow: auto;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <section id="lock-screen" class="screen">
      <div class="lock-card">
        <h1>Enter access password</h1>
        <form id="lock-form" class="lock-form">
          <input id="password" type="password" autocomplete="current-password" autofocus>
          <button class="icon" type="submit" aria-label="Submit password"></button>
        </form>
        <div id="lock-status" class="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="editor-screen" class="screen">
      <header>
        <h1>AM eBay Listing Assistant</h1>
        <div class="actions">
          <button id="save-btn" class="secondary">Save</button>
          <button id="copy-title-btn" class="secondary">Copy Title</button>
          <button id="copy-description-btn" class="secondary">Copy Description</button>
          <button id="copy-variants-btn" class="secondary">Copy Variants</button>
          <button id="export-csv-btn" class="secondary">Export CSV</button>
          <button id="list-btn" class="success">List It</button>
        </div>
      </header>

      <main>
        <section class="card grid">
          <h2>Listing data</h2>
          <label>
            Title
            <input id="title" maxlength="80">
          </label>
          <label>
            Description HTML
            <textarea id="description"></textarea>
          </label>
          <div class="grid three">
            <label>
              Price
              <input id="price" inputmode="decimal">
            </label>
            <label>
              Quantity
              <input id="quantity" type="number" min="0" step="1">
            </label>
            <label>
              SKU prefix
              <input id="sku-prefix">
            </label>
          </div>
          <div class="grid three">
            <label>
              Category hints
              <input id="category-hints">
            </label>
            <label>
              eBay region
              <select id="region"></select>
            </label>
            <label>
              Manual markup %
              <input id="markup-percent" type="number" step="0.01" value="0">
            </label>
          </div>
          <div class="grid three">
            <label>
              Condition
              <select id="condition">
                <option>New</option>
                <option>New with tags</option>
                <option>New without tags</option>
                <option>Used</option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button id="apply-markup-btn" class="secondary" type="button">Apply Markup</button>
            <button id="add-specific-btn" class="secondary" type="button">Add Item Specific</button>
          </div>
          <div id="status" class="status" aria-live="polite"></div>
        </section>

        <section class="card grid">
          <h2>Product images</h2>
          <div id="images" class="image-grid"></div>
        </section>

        <section class="card grid">
          <h2>Item specifics</h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Value</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="specifics-body"></tbody>
            </table>
          </div>
        </section>

        <section class="card grid">
          <h2>Variations</h2>
          <div class="actions" id="dimension-actions"></div>
          <div class="scroll">
            <table>
              <thead id="variations-head"></thead>
              <tbody id="variations-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </section>

    <script src="editor.js"></script>
  </body>
</html>
